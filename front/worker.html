<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Панель работника</title>
    </head>
    <body>
        <header class="topbar">
            <div class="container">
                <a class="logo" href="/">Auto<span>Service</span></a>
                <nav class="nav">
                    <span>Работник: <b id="workerName"></b></span
                    ><button class="btn btn-danger" id="logoutBtn">Выйти</button>
                </nav>
            </div>
        </header>
        <main class="panel container">
            <h1>Панель мастера</h1>
            <p class="muted">Здесь мастер видит заявки и меняет статусы работ.</p>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Авто</th>
                        <th>Работа</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </main>
        <script type="module" src="/src/worker.js"></script>
    </body>
</html>
